services:
  - type: web
    name: event-platform-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PGSSL
        value: "true"
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
