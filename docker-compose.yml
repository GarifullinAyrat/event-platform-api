services:
  postgres:
    image: postgres:16-alpine
    container_name: event-platform-postgres
    environment:
      POSTGRES_DB: event_app
      POSTGRES_USER: event_app
      POSTGRES_PASSWORD: event_app_password
    ports:
      - "5432:5432"
    volumes:
      - event-platform-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_app -d event_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  event-platform-postgres:
